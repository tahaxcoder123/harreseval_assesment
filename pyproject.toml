[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-eval"
version = "0.1.0"
description = "A focused comparison and evaluation tool for coding-agent harnesses"
authors = [
    {name = "AI Evaluation Engineering Team"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jinja2>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
harness-eval = "harness_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
